      - name: Adapter l'adresse du site si elle a ete indiquee
        env:
          SITE: ${{ github.event.inputs.site_url }}
        run: |
          if [ -n "$SITE" ]; then
            python3 - "$SITE" <<'FIN_PY'
          import re, sys
          chemin = 'app/src/main/res/values/strings.xml'
          adresse = sys.argv[1].strip().rstrip('/')
          texte = open(chemin, encoding='utf-8').read()
          texte = re.sub(r'(<string name="site_url">)[^<]*(</string>)',
                         lambda m: m.group(1) + adresse + m.group(2), texte)
          open(chemin, 'w', encoding='utf-8').write(texte)
          print('Adresse utilisee :', adresse)
          FIN_PY
          fi
          grep site_url app/src/main/res/values/strings.xml

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Preparer Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Compiler l'application
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renommer l'APK
        run: |
          mkdir -p sortie
          cp app/build/outputs/apk/debug/app-debug.apk sortie/protestante2zone.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: protestante2zone-apk
          path: sortie/protestante2zone.apk
          if-no-files-found: error
