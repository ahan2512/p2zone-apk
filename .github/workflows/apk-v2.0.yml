          cat > 'app/src/main/res/layout/activity_main.xml' <<'FIN_DU_FICHIER'
          <?xml version="1.0" encoding="utf-8"?>
          <!-- Le rafraichissement par glissement (tirer vers le bas) a ete retire :
               dans les pages qui defilent, il se declenchait au lieu de faire monter
