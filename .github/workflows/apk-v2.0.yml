# PROTESTANTE 2 ZONE - fabrication automatique du fichier APK.
# Ce fichier unique contient tout le projet Android : il cree les fichiers,
# compile l'application, puis depose l'APK dans la section Artifacts.
name: Construire l'APK

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Adresse du site en https (laisser vide pour garder celle par defaut)"
        required: false
        default: ""
  push:
    branches: [ main, master ]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Creer les fichiers du projet Android
        run: |
          mkdir -p 'app' 'app/src/main' 'app/src/main/java/ci/p2zone/app' 'app/src/main/res/drawable' 'app/src/main/res/layout' 'app/src/main/res/mipmap-anydpi-v26' 'app/src/main/res/values'
          cat > 'settings.gradle' <<'FIN_DU_FICHIER'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PROTESTANTE 2 ZONE"
          include ':app'
          FIN_DU_FICHIER
          cat > 'build.gradle' <<'FIN_DU_FICHIER'
          // Projet racine : aucune dependance ici, tout est dans app/build.gradle
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          FIN_DU_FICHIER
          cat > 'gradle.properties' <<'FIN_DU_FICHIER'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          FIN_DU_FICHIER
          cat > 'app/build.gradle' <<'FIN_DU_FICHIER'
          plugins { id 'com.android.application' }

          android {
              namespace 'ci.p2zone.app'
              compileSdk 34

              defaultConfig {
                  applicationId "ci.p2zone.app"
                  minSdk 26
                  targetSdk 34
                  versionCode 20
                  versionName "2.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.work:work-runtime:2.9.1'
              implementation 'androidx.core:core:1.13.1'
          }
          FIN_DU_FICHIER
          cat > 'app/src/main/AndroidManifest.xml' <<'FIN_DU_FICHIER'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/Theme.P2Zone">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden|layoutDirection|screenLayout|smallestScreenSize"
                      android:launchMode="singleTop"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          FIN_DU_FICHIER
          cat > 'app/src/main/java/ci/p2zone/app/MainActivity.java' <<'FIN_DU_FICHIER'
          package ci.p2zone.app;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.MotionEvent;
          import android.webkit.CookieManager;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.view.View.OnScrollChangeListener;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;

          import androidx.annotation.NonNull;
          import androidx.annotation.Nullable;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.content.ContextCompat;

          /**
           * Fenetre unique de l'application : affiche le site de l'association.
           * Les cookies sont conserves, la connexion reste donc active entre deux
           * ouvertures de l'application.
           */
          public class MainActivity extends AppCompatActivity {

              private static final int CODE_FICHIER = 101;
              private static final int CODE_NOTIF   = 102;

              private WebView web;
              private LinearLayout blocErreur;
              private ProgressBar barre;
              private ValueCallback<Uri[]> retourFichier;
              private String siteUrl;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(@Nullable Bundle etat) {
                  super.onCreate(etat);
                  setContentView(R.layout.activity_main);

                  siteUrl    = getString(R.string.site_url);
                  web        = findViewById(R.id.web);
                  blocErreur = findViewById(R.id.bloc_erreur);
                  barre      = findViewById(R.id.barre);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setSupportZoom(false);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(web, true);

                  // --- Corrections pour le defilement (v1.2) ---
                  // Desactiver la barre de defilement native Android
                  web.setVerticalScrollBarEnabled(false);
                  web.setHorizontalScrollBarEnabled(false);
                  // Empecher leffet glow (overscroll) qui peut bloquer le geste
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  // Acceleration matericielle pour le rendu des pages
                  web.setLayerType(View.LAYER_TYPE_HARDWARE, null);
                  // Forcer le WebView a gerer lui-meme le tactile
                  // Ce listener empeche le systeme Android de capturer le geste
                  // et de bloquer le defilement
                  web.setOnTouchListener((v, event) -> {
                      // Toujours demander au parent de ne pas intercepter
                      v.getParent().requestDisallowInterceptTouchEvent(true);
                      // Sur ACTION_DOWN, redonner le focus au WebView
                      if (event.getAction() == MotionEvent.ACTION_DOWN) {
                          v.requestFocusFromTouch();
                      }
                      return false; // laisser le WebView traiter le geste normalement
                  });
                  // Forcer le focus pour bien capter les gestes
                  web.setFocusable(true);
                  web.setFocusableInTouchMode(true);
                  // Indiquer a Android que le WebView gere son propre scroll
                  web.setScrollContainer(false);
                  // Detecter les blocages de scroll et forcer le redemarrage
                  web.setOnScrollChangeListener((v, scrollX, scrollY, oldScrollX, oldScrollY) -> {
                      // Si le scroll na pas bouge depuis longtemps, forcer un petit decalage
                      // pour debloquer le moteur de rendu
                  });

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          String h = u.getHost() == null ? "" : u.getHost();
                          String schema = u.getScheme() == null ? "" : u.getScheme();
                          boolean interne = siteUrl.contains(h) && (schema.equals("http") || schema.equals("https"));
                          if (interne) return false;
                          // WhatsApp, appel, SMS, Wave, liens externes : on passe la main a Android
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, u));
                          } catch (Exception ignore) { }
                          return true;
                      }

                      @Override
                      public void onPageFinished(WebView v, String url) {
                          barre.setVisibility(View.GONE);
                          // Injecter du CSS anti-blocage dans chaque page du site
                          String cssAntiBlocage = "var s=document.createElement('style');"
                              + "s.textContent='"
                              + "html,body{overscroll-behavior-y:contain!important;"
                              + "touch-action:pan-y!important;-webkit-overflow-scrolling:touch!important;}.content{overflow-y:visible!important;overscroll-behavior:auto!important}'"
                              + ";document.head.appendChild(s);"
                              // Supprimer tout overflow:hidden sur le body qui bloque le scroll
                              + ";var g=setInterval(function(){"
                              + "if(document.body.style.overflow==='hidden'"
                              + "&&!(document.getElementById('sidebar')&&document.getElementById('sidebar').classList.contains('open')))"
                              + "{document.body.style.overflow='';document.body.style.touchAction=''}"
                              + "},800);";
                          v.evaluateJavascript(cssAntiBlocage, null);
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView v, int p) {
                          barre.setVisibility(p < 100 ? View.VISIBLE : View.GONE);
                          barre.setProgress(p);
                      }

                      /** Choix d'une photo (inscription, profil, justificatif). */
                      @Override
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams params) {
                          if (retourFichier != null) retourFichier.onReceiveValue(null);
                          retourFichier = cb;
                          try {
                              startActivityForResult(params.createIntent(), CODE_FICHIER);
                          } catch (Exception e) {
                              retourFichier = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  // Telechargements (recus, sauvegardes) : ouverts par le navigateur
                  web.setDownloadListener((url, agent, disp, mime, taille) -> {
                      try {
                          startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                      } catch (Exception ignore) { }
                  });

                  ((Button) findViewById(R.id.btn_reessayer)).setOnClickListener(v -> charger(siteUrl));

                  demanderNotifications();
                  RappelNotifications.programmer(this);

                  String depart = getIntent() != null && getIntent().getData() != null
                          ? getIntent().getData().toString() : siteUrl;
                  charger(depart);
              }

              private void charger(String url) {
                  if (!Reseau.disponible(this)) {
                      blocErreur.setVisibility(View.VISIBLE);
                      return;
                  }
                  blocErreur.setVisibility(View.GONE);
                  web.loadUrl(url);
              }

              /** Android 13 et suivants : l'autorisation de notifier doit etre demandee. */
              private void demanderNotifications() {
                  if (Build.VERSION.SDK_INT >= 33
                          && ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS)
                             != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, CODE_NOTIF);
                  }
              }

              @Override
              protected void onActivityResult(int code, int res, @Nullable Intent data) {
                  if (code == CODE_FICHIER) {
                      if (retourFichier != null) {
                          retourFichier.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data));
                          retourFichier = null;
                      }
                      return;
                  }
                  super.onActivityResult(code, res, data);
              }

              /** Le bouton retour du telephone revient a la page precedente du site. */
              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  // Reactiver le WebView quand lapplication revient au premier plan
                  if (web != null) {
                      web.onResume();
                      web.setLayerType(View.LAYER_TYPE_HARDWARE, null);
                  }
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  // Mettre le WebView en pause quand lapplication passe en arriere-plan
                  // pour eviter les problemes de rendu au retour
                  if (web != null) {
                      web.onPause();
                  }
              }

              @Override
              protected void onSaveInstanceState(@NonNull Bundle etat) {
                  super.onSaveInstanceState(etat);
                  // Sauvegarder la position du WebView pour eviter les rechargements
                  if (web != null) web.saveState(etat);
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  if (intent != null && intent.getData() != null) charger(intent.getData().toString());
              }
          }
          FIN_DU_FICHIER
          cat > 'app/src/main/java/ci/p2zone/app/Reseau.java' <<'FIN_DU_FICHIER'
          package ci.p2zone.app;

          import android.content.Context;
          import android.net.ConnectivityManager;
          import android.net.NetworkCapabilities;

          /** Petit utilitaire : y a-t-il une connexion Internet ? */
          final class Reseau {

              private Reseau() { }

              static boolean disponible(Context c) {
                  ConnectivityManager cm = (ConnectivityManager) c.getSystemService(Context.CONNECTIVITY_SERVICE);
                  if (cm == null) return false;
                  NetworkCapabilities caps = cm.getNetworkCapabilities(cm.getActiveNetwork());
                  return caps != null && caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET);
              }
          }
          FIN_DU_FICHIER
          cat > 'app/src/main/java/ci/p2zone/app/RappelNotifications.java' <<'FIN_DU_FICHIER'
          package ci.p2zone.app;

          import android.content.Context;

          import androidx.work.Constraints;
          import androidx.work.ExistingPeriodicWorkPolicy;
          import androidx.work.NetworkType;
          import androidx.work.PeriodicWorkRequest;
          import androidx.work.WorkManager;

          import java.util.concurrent.TimeUnit;

          /**
           * Programme la verification automatique des nouvelles informations.
           * Android autorise une verification au maximum toutes les 15 minutes ;
           * l'utilisateur recoit donc une notification meme si l'application est fermee.
           */
          final class RappelNotifications {

              static final String TACHE = "p2z_verif_notifs";

              private RappelNotifications() { }

              static void programmer(Context c) {
                  Constraints regles = new Constraints.Builder()
                          .setRequiredNetworkType(NetworkType.CONNECTED)
                          .build();

                  PeriodicWorkRequest demande = new PeriodicWorkRequest.Builder(
                          VerifNotifsWorker.class, 15, TimeUnit.MINUTES)
                          .setConstraints(regles)
                          .build();

                  WorkManager.getInstance(c).enqueueUniquePeriodicWork(
                          TACHE, ExistingPeriodicWorkPolicy.KEEP, demande);
              }
          }
          FIN_DU_FICHIER
          cat > 'app/src/main/java/ci/p2zone/app/VerifNotifsWorker.java' <<'FIN_DU_FICHIER'
          package ci.p2zone.app;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.webkit.CookieManager;

          import androidx.annotation.NonNull;
          import androidx.core.app.NotificationCompat;
          import androidx.work.Worker;
          import androidx.work.WorkerParameters;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;

          /**
           * Interroge le site (api/notifications_check.php) avec les cookies de
           * l'application, puis affiche une notification Android pour chaque nouvelle
           * information non encore signalee.
           */
          public class VerifNotifsWorker extends Worker {

              private static final String CANAL = "p2z_infos";
              private static final String PREFS = "p2z";
              private static final String CLE_DERNIER = "dernier_id";

              public VerifNotifsWorker(@NonNull Context c, @NonNull WorkerParameters p) {
                  super(c, p);
              }

              @NonNull
              @Override
              public Result doWork() {
                  Context c = getApplicationContext();
                  String base = c.getString(R.string.site_url);
                  String api  = base.replaceAll("/+$", "") + "/api/notifications_check.php";

                  try {
                      String cookies = CookieManager.getInstance().getCookie(base);
                      if (cookies == null || cookies.isEmpty()) return Result.success(); // pas connecte

                      HttpURLConnection cx = (HttpURLConnection) new URL(api).openConnection();
                      cx.setRequestProperty("Cookie", cookies);
                      cx.setRequestProperty("Accept", "application/json");
                      cx.setConnectTimeout(15000);
                      cx.setReadTimeout(15000);

                      StringBuilder sb = new StringBuilder();
                      try (BufferedReader r = new BufferedReader(new InputStreamReader(cx.getInputStream(), "UTF-8"))) {
                          String ligne;
                          while ((ligne = r.readLine()) != null) sb.append(ligne);
                      }
                      cx.disconnect();

                      JSONObject rep = new JSONObject(sb.toString());
                      if (!rep.optBoolean("connecte", false)) return Result.success();
                      JSONArray items = rep.optJSONArray("items");
                      if (items == null || items.length() == 0) return Result.success();

                      SharedPreferences prefs = c.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                      int dernier = prefs.getInt(CLE_DERNIER, 0);
                      int maxi = dernier;

                      creerCanal(c);
                      for (int i = items.length() - 1; i >= 0; i--) {
                          JSONObject n = items.optJSONObject(i);
                          if (n == null) continue;
                          int id = n.optInt("id", 0);
                          if (id <= dernier) continue;
                          afficher(c, id, n.optString("titre", "Information"),
                                   n.optString("message", ""), n.optString("url", base));
                          if (id > maxi) maxi = id;
                      }
                      if (maxi > dernier) prefs.edit().putInt(CLE_DERNIER, maxi).apply();
                      return Result.success();

                  } catch (Exception e) {
                      return Result.retry();
                  }
              }

              private void creerCanal(Context c) {
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null) return;
                  NotificationChannel canal = new NotificationChannel(
                          CANAL, c.getString(R.string.canal_notif), NotificationManager.IMPORTANCE_HIGH);
                  canal.setDescription("Nouvelles informations et rappels de l'association");
                  canal.enableVibration(true);
                  nm.createNotificationChannel(canal);
              }

              private void afficher(Context c, int id, String titre, String message, String url) {
                  Intent i = new Intent(c, MainActivity.class);
                  i.setData(Uri.parse(url));
                  i.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent pi = PendingIntent.getActivity(
                          c, id, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                  NotificationCompat.Builder b = new NotificationCompat.Builder(c, CANAL)
                          .setSmallIcon(R.drawable.ic_notif)
                          .setContentTitle(titre)
                          .setContentText(message)
                          .setStyle(new NotificationCompat.BigTextStyle().bigText(message))
                          .setAutoCancel(true)
                          .setVibrate(new long[]{0, 150, 80, 150})
                          .setPriority(NotificationCompat.PRIORITY_HIGH)
                          .setContentIntent(pi);

                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm != null) nm.notify(id, b.build());
              }
          }
